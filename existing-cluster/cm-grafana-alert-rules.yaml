apiVersion: v1
kind: ConfigMap
metadata:
  name: node-problem-detector-alerts
  labels:
    grafana_alert: "1"
data:
  k8s-alert.yml: |-
    apiVersion: 1
    groups:
        - orgId: 1
          name: Node Problem Detector
          folder: OKE
          interval: 1m
          rules:
            - uid: oke_npd_gpu_row_remap
              title: GPU Row Remap
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: prometheus
                  model:
                    editorMode: code
                    expr: problem_gauge{reason="GpuRowRemapHasIssues",type="GpuRowRemap"}
                    instant: true
                    intervalMs: 300000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 0
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              dashboardUid: ""
              panelId: 0
              noDataState: NoData
              execErrState: Error
              for: 5m
              isPaused: false
